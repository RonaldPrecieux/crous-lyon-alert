name: Veille logements CROUS Lyon

on:
  # GitHub ne déclenche en pratique que toutes les quelques heures : chaque exécution boucle
  # ensuite elle-même (vérification toutes les 2 min). Les déclenchements en trop attendent leur tour.
  schedule:
    - cron: "*/5 * * * *"
  # Lancement manuel : Actions → Veille logements CROUS Lyon → Run workflow.
  workflow_dispatch: {}

# Nécessaire pour committer l'état (annonces déjà vues) dans le dépôt.
permissions:
  contents: write

concurrency:
  group: crous-veille
  cancel-in-progress: false

env:
  # Zone surveillée : Lyon + Villeurbanne (campagne 48 = « Fil de l'eau 2026-27 », logements en cours d'année jusqu'au 31/08/2027).
  # Pour changer de zone : refaire une recherche sur trouverunlogement.lescrous.fr et coller l'URL.
  # Plusieurs zones possibles : une URL par ligne.
  SEARCH_URL: >-
    https://trouverunlogement.lescrous.fr/tools/48/search?bounds=4.7718134_45.8082628_4.8983774_45.7073666&locationName=Lyon

jobs:
  veille:
    runs-on: ubuntu-latest
    # Un job GitHub dure 6 h au maximum : la boucle s'arrête à 5 h 40, la tâche planifiée suivante prend le relais.
    timeout-minutes: 355
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Veille en boucle (une vérification toutes les 2 minutes)
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_TO_EXTRA: ${{ secrets.MAIL_TO_EXTRA }}
          INTERVAL: "120"
          # Lancement manuel : une seule vérification. Planifié : boucle de 5 h 40.
          DURATION: ${{ github.event_name == 'workflow_dispatch' && '0' || '20400' }}
        run: bash veille_loop.sh
